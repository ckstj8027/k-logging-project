// 공통 Jackson 설정 (ingestion/query/auth 용).
// k8s SDK 타입(IntOrString) 처리가 필요한 analysis 는 consumer-kafka 모듈의 설정을 사용한다.
plugins {
    id 'cnapp.java-boot'
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
}
