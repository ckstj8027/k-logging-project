// UseCase: In-Port 인터페이스 + 패키지 전용(package-private) 구현.
// 어댑터(repository-jpa, cache-redis)를 직접 참조하지 않는다 — infrastructure 의 포트만 의존.
plugins {
    id 'cnapp.java-boot'
}

dependencies {
    api project(':msa-version:query:model')
    implementation project(':msa-version:query:infrastructure')
    implementation project(':msa-version:common:model')
}
