// Bootstrap: 조립 전용 모듈. 어댑터들을 classpath 에 올려 AutoConfiguration 으로 배선한다.
// ObjectMapper 는 consumer-kafka 의 AnalysisJacksonAutoConfiguration 이 제공하므로 common:jackson 을 넣지 않는다.
plugins {
    id 'cnapp.java'
}
apply plugin: 'org.springframework.boot'

dependencies {
    implementation project(':msa-version:analysis:repository-jpa')
    implementation project(':msa-version:analysis:cache-redis')
    implementation project(':msa-version:analysis:consumer-kafka')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    runtimeOnly 'org.postgresql:postgresql'
}

// plain jar 비활성화: build/libs 에 bootJar 하나만 남겨 Dockerfile 의 *.jar 복사가 모호해지지 않게 한다
jar {
    enabled = false
}
